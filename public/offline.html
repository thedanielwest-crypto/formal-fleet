<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Formal Fleet — Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #101d33;
        color: #faf6ee;
        font-family: -apple-system, "Segoe UI", sans-serif;
        text-align: center;
        padding: 24px;
        box-sizing: border-box;
      }
      .card { max-width: 360px; }
      h1 { font-family: Georgia, serif; color: #e6c65c; font-size: 1.5rem; margin-bottom: 8px; }
      p { color: #cfd3dc; line-height: 1.5; }
      a {
        display: inline-block;
        margin-top: 20px;
        background: #c9a227;
        color: #101d33;
        text-decoration: none;
        font-weight: 600;
        padding: 10px 20px;
        border-radius: 999px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>You're offline</h1>
      <p>Formal Fleet needs a connection to load new listings. Reconnect and try again — anything you've already viewed may still be available.</p>
      <a href="/">Try again</a>
    </div>
  </body>
</html>
